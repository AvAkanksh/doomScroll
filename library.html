<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Library — DoomScroll</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#050505;--surface:#0c0c0c;--surface2:#111;--text:#f0f0f0;--dim:#666;--muted:#999;--border:#1a1a1a;--accent:#a78bfa;--radius:12px}
html{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding-bottom:40px}

/* ─── Header ─── */
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px}
.header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.back-btn{background:var(--surface);border:1px solid var(--border);color:var(--muted);font-size:12px;padding:6px 14px;border-radius:20px;cursor:pointer;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:5px;transition:all .2s}
.back-btn:hover{color:var(--text);border-color:#333}
.back-btn svg{width:14px;height:14px;fill:currentColor}
header h1{font-size:18px;font-weight:800;letter-spacing:-.3px;flex:1}
header h1 span{background:linear-gradient(135deg,#a78bfa,#06b6d4);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#search{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:13px;padding:7px 14px;border-radius:20px;width:200px;outline:none;transition:border-color .2s}
#search:focus{border-color:var(--accent)}
#search::placeholder{color:var(--dim)}

/* ─── Main ─── */
main{max-width:900px;margin:0 auto;padding:20px 16px}

/* ─── Section ─── */
.section{margin-bottom:32px}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;cursor:pointer;user-select:none}
.section-icon{width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.section-title{font-size:16px;font-weight:700;flex:1;letter-spacing:-.2px}
.section-count{font-size:11px;color:var(--dim);background:var(--surface);padding:3px 10px;border-radius:10px;border:1px solid var(--border)}
.section-chevron{color:var(--dim);transition:transform .2s;font-size:12px}
.section.collapsed .section-chevron{transform:rotate(-90deg)}
.section.collapsed .repos{display:none}

/* ─── Repo cards ─── */
.repos{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.repo{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.repo:hover{border-color:#333;background:var(--surface2);transform:translateY(-1px)}
.repo-name{font-size:13px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.repo-name svg{width:14px;height:14px;fill:var(--dim);flex-shrink:0}
.repo-desc{font-size:11px;color:var(--dim);margin-bottom:8px}
.repo-stats{display:flex;gap:12px;font-size:10px;color:var(--dim)}
.repo-stats span{display:flex;align-items:center;gap:3px}
.repo-github{position:absolute;top:12px;right:12px;color:var(--dim);text-decoration:none;font-size:10px;padding:3px 8px;border-radius:8px;border:1px solid var(--border);transition:all .2s}
.repo-github:hover{color:var(--text);border-color:#444}

/* ─── File viewer ─── */
#viewer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:none;backdrop-filter:blur(4px)}
#viewer-overlay.open{display:flex}
#viewer{width:100%;max-width:860px;margin:auto;background:var(--bg);border:1px solid var(--border);border-radius:16px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden}
#viewer-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-shrink:0}
#viewer-header h2{font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#viewer-close{background:none;border:1px solid var(--border);color:var(--muted);width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all .2s}
#viewer-close:hover{color:var(--text);border-color:#444}

#viewer-sidebar{display:flex;flex:1;overflow:hidden}
#file-list{width:220px;border-right:1px solid var(--border);overflow-y:auto;padding:8px;flex-shrink:0;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.file-item{padding:6px 10px;font-size:11px;color:var(--muted);cursor:pointer;border-radius:8px;margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:all .15s}
.file-item:hover{background:var(--surface);color:var(--text)}
.file-item.active{background:var(--accent);color:#fff}
.file-dir{padding:4px 10px;font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:.8px;font-weight:700;margin-top:8px}

#file-content{flex:1;overflow:auto;padding:20px;font-size:13px;line-height:1.7;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
#file-content pre{background:#0d1117;border-radius:10px;padding:14px;margin:8px 0;overflow-x:auto;border:1px solid #21262d}
#file-content pre code{font-size:12px;line-height:1.55;font-family:'Fira Code',Consolas,monospace}
#file-content h1,#file-content h2,#file-content h3{margin:16px 0 8px;font-weight:700}
#file-content h1{font-size:20px;border-bottom:1px solid var(--border);padding-bottom:8px}
#file-content h2{font-size:17px}
#file-content h3{font-size:14px}
#file-content p{margin-bottom:8px;color:#bbb}
#file-content ul,#file-content ol{margin:6px 0 10px;padding-left:20px;color:#bbb}
#file-content li{margin:3px 0}
#file-content code:not([class*="language-"]){background:#161b22;padding:1px 5px;border-radius:4px;font-size:12px;font-family:'Fira Code',Consolas,monospace;color:#e6db74;border:1px solid #21262d}
#file-content blockquote{border-left:3px solid var(--accent);padding:8px 14px;margin:8px 0;color:var(--muted);background:rgba(167,139,250,.04);border-radius:0 8px 8px 0}
#file-content img{max-width:100%;border-radius:8px;margin:8px 0}
#file-content a{color:var(--accent);text-decoration:none}
#file-content a:hover{text-decoration:underline}
#file-content table{border-collapse:collapse;margin:8px 0;width:100%}
#file-content th,#file-content td{border:1px solid var(--border);padding:6px 10px;font-size:12px;text-align:left}
#file-content th{background:var(--surface);font-weight:600}

.loading-file{display:flex;align-items:center;justify-content:center;height:200px;color:var(--dim);font-size:13px}

@media(max-width:640px){
  #file-list{width:160px}
  #search{width:120px}
  .repos{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <a class="back-btn" href="index.html"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Cards</a>
    <h1><span>Library</span></h1>
    <input type="text" id="search" placeholder="Search files...">
  </div>
</header>

<main id="main"></main>

<div id="viewer-overlay">
  <div id="viewer">
    <div id="viewer-header">
      <h2 id="viewer-title">File</h2>
      <button id="viewer-close">&times;</button>
    </div>
    <div id="viewer-sidebar">
      <div id="file-list"></div>
      <div id="file-content"><p class="loading-file">Select a file</p></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script>
const sectionIcons=[
  {bg:'#a78bfa22',clr:'#a78bfa',icon:'&#9881;'},
  {bg:'#06b6d422',clr:'#06b6d4',icon:'&#128187;'},
  {bg:'#f97316aa',clr:'#f97316',icon:'&#129504;'},
  {bg:'#34d39922',clr:'#34d399',icon:'&#128172;'},
  {bg:'#f43f5e22',clr:'#f43f5e',icon:'&#129513;'},
  {bg:'#eab30822',clr:'#eab308',icon:'&#128218;'},
];

let index=[];
const mainEl=document.getElementById('main');
const overlay=document.getElementById('viewer-overlay');
const viewer=document.getElementById('viewer');
const viewerTitle=document.getElementById('viewer-title');
const fileList=document.getElementById('file-list');
const fileContent=document.getElementById('file-content');
const searchInput=document.getElementById('search');

async function init(){
  try{index=await fetch('library/index.json').then(r=>r.json())}
  catch(e){mainEl.innerHTML='<p style="color:#f44;padding:40px">Failed to load library index</p>';return}
  renderSections();
}

function renderSections(filter=''){
  mainEl.innerHTML='';
  const q=filter.toLowerCase();
  index.forEach((section,si)=>{
    const s=sectionIcons[si%sectionIcons.length];
    const filteredRepos=section.repos.filter(r=>{
      if(!q)return true;
      if(r.description.toLowerCase().includes(q))return true;
      if(r.dir.toLowerCase().includes(q))return true;
      return r.files.some(f=>f.name.toLowerCase().includes(q));
    });
    if(q&&!filteredRepos.length)return;

    const el=document.createElement('div');
    el.className='section';
    el.innerHTML=`
      <div class="section-header">
        <div class="section-icon" style="background:${s.bg};color:${s.clr}">${s.icon}</div>
        <span class="section-title">${section.label}</span>
        <span class="section-count">${filteredRepos.length} repos</span>
        <span class="section-chevron">&#9660;</span>
      </div>
      <div class="repos"></div>`;

    el.querySelector('.section-header').onclick=()=>el.classList.toggle('collapsed');

    const reposEl=el.querySelector('.repos');
    filteredRepos.forEach(repo=>{
      const card=document.createElement('div');
      card.className='repo';
      const sizeKB=Math.round(repo.total_size/1024);
      card.innerHTML=`
        <div class="repo-name"><svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>${repo.description}</div>
        <div class="repo-desc">${repo.dir}</div>
        <div class="repo-stats">
          <span>&#128196; ${repo.file_count} files</span>
          <span>&#128190; ${sizeKB>1024?(sizeKB/1024).toFixed(1)+'MB':sizeKB+'KB'}</span>
        </div>
        ${repo.github?`<a class="repo-github" href="${repo.github}" target="_blank" rel="noopener" onclick="event.stopPropagation()">GitHub &nearr;</a>`:''}`;
      card.onclick=()=>openRepo(repo,section.label);
      reposEl.appendChild(card);
    });

    mainEl.appendChild(el);
  });
}

let currentRepo=null;

function openRepo(repo,sectionLabel){
  currentRepo=repo;
  viewerTitle.textContent=repo.description;
  overlay.classList.add('open');
  document.body.style.overflow='hidden';

  // Build file tree
  fileList.innerHTML='';
  const dirs={};
  repo.files.forEach(f=>{
    const d=f.dir||'';
    if(!dirs[d])dirs[d]=[];
    dirs[d].push(f);
  });

  const sortedDirs=Object.keys(dirs).sort();
  sortedDirs.forEach(d=>{
    if(d){
      const dEl=document.createElement('div');
      dEl.className='file-dir';
      dEl.textContent=d;
      fileList.appendChild(dEl);
    }
    dirs[d].sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>{
      const item=document.createElement('div');
      item.className='file-item';
      item.textContent=f.name;
      item.title=f.path;
      item.onclick=()=>loadFile(f,item);
      fileList.appendChild(item);
    });
  });

  // Auto-load first meaningful file
  const readme=repo.files.find(f=>f.name.toLowerCase()==='readme.md');
  const first=readme||repo.files[0];
  if(first){
    const firstItem=fileList.querySelector('.file-item');
    if(readme){
      const items=fileList.querySelectorAll('.file-item');
      items.forEach(it=>{if(it.textContent===readme.name){loadFile(readme,it)}});
    }else if(firstItem){
      loadFile(first,firstItem);
    }
  }else{
    fileContent.innerHTML='<p class="loading-file">No files</p>';
  }
}

async function loadFile(f,itemEl){
  fileList.querySelectorAll('.file-item').forEach(i=>i.classList.remove('active'));
  if(itemEl)itemEl.classList.add('active');
  fileContent.innerHTML='<p class="loading-file">Loading...</p>';

  try{
    const resp=await fetch('library/'+f.path);
    const text=await resp.text();

    if(f.ext==='.md'){
      fileContent.innerHTML=renderMarkdown(text);
    }else if(f.ext==='.py'){
      fileContent.innerHTML='<pre><code class="language-python">'+escHtml(text)+'</code></pre>';
    }else if(f.ext==='.json'){
      fileContent.innerHTML='<pre><code class="language-javascript">'+escHtml(text)+'</code></pre>';
    }else if(f.ext==='.ipynb'){
      fileContent.innerHTML=renderNotebook(text);
    }else{
      fileContent.innerHTML='<pre>'+escHtml(text)+'</pre>';
    }
    try{Prism.highlightAllUnder(fileContent)}catch(e){}
    fileContent.scrollTop=0;
  }catch(e){
    fileContent.innerHTML='<p class="loading-file">Failed to load file</p>';
  }
}

function renderMarkdown(text){
  let html=text;
  // Code blocks
  html=html.replace(/```(\w*)\n([\s\S]*?)```/g,(_,lang,code)=>{
    lang=lang||'python';
    return'<pre><code class="language-'+lang+'">'+escHtml(code.trim())+'</code></pre>';
  });
  // Headers
  html=html.replace(/^#### (.+)$/gm,'<h4>$1</h4>');
  html=html.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  html=html.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  html=html.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  // Bold, italic, code
  html=html.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  html=html.replace(/\*(.+?)\*/g,'<em>$1</em>');
  html=html.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  // Links
  html=html.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  // Images (skip, just show alt)
  html=html.replace(/!\[([^\]]*)\]\([^)]+\)/g,'<em>[image: $1]</em>');
  // Blockquotes
  html=html.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  // HR
  html=html.replace(/^-{3,}$/gm,'<hr>');
  // List items
  html=html.replace(/^(\s*)[-*] (.+)$/gm,'$1<li>$2</li>');
  html=html.replace(/^(\s*)\d+[.)]\s+(.+)$/gm,'$1<li>$2</li>');
  // Wrap adjacent <li> in <ul>
  html=html.replace(/((?:<li>.*<\/li>\n?)+)/g,'<ul>$1</ul>');
  // Paragraphs
  html=html.replace(/\n{2,}/g,'</p><p>');
  html='<p>'+html+'</p>';
  html=html.replace(/<p>\s*<(h[1-4]|pre|ul|ol|blockquote|hr)/g,'<$1');
  html=html.replace(/<\/(h[1-4]|pre|ul|ol|blockquote)>\s*<\/p>/g,'</$1>');
  html=html.replace(/<p>\s*<\/p>/g,'');
  html=html.replace(/<p><hr><\/p>/g,'<hr>');
  return html;
}

function renderNotebook(text){
  try{
    const nb=JSON.parse(text);
    let html='';
    (nb.cells||[]).forEach(cell=>{
      const src=(cell.source||[]).join('');
      if(cell.cell_type==='markdown'){
        html+=renderMarkdown(src);
      }else if(cell.cell_type==='code'){
        html+='<pre><code class="language-python">'+escHtml(src)+'</code></pre>';
        const outputs=(cell.outputs||[]);
        outputs.forEach(out=>{
          if(out.text)html+='<pre style="color:var(--muted);border-color:#1a1a1a">'+escHtml((out.text||[]).join(''))+'</pre>';
        });
      }
    });
    return html||'<p>Empty notebook</p>';
  }catch(e){
    return'<p>Could not parse notebook</p>';
  }
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

// Close viewer
document.getElementById('viewer-close').onclick=()=>{
  overlay.classList.remove('open');
  document.body.style.overflow='';
};
overlay.onclick=e=>{if(e.target===overlay){overlay.classList.remove('open');document.body.style.overflow=''}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&overlay.classList.contains('open')){overlay.classList.remove('open');document.body.style.overflow=''}});

// Search
let searchTimeout;
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimeout);
  searchTimeout=setTimeout(()=>renderSections(searchInput.value),200);
});

init();
</script>
</body>
</html>
