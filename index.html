<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>DoomScroll — Learn While You Scroll</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#000;--card:#0a0a0a;--card-up:#111;--text:#f5f5f5;--dim:#777;--border:#1a1a1a;--code:#0d1117}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

#app{height:100%;width:100%;max-width:540px;margin:0 auto;position:relative}

/* Category bar — single row, horizontal scroll */
#cat-bar{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;display:flex;gap:6px;padding:10px 16px 8px;background:linear-gradient(var(--bg) 70%,transparent);z-index:10;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#cat-bar::-webkit-scrollbar{display:none}
.cat-pill{font-size:10px;padding:4px 10px;border-radius:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:#fff;opacity:.5;white-space:nowrap;flex-shrink:0;cursor:pointer;transition:opacity .2s,transform .2s;pointer-events:auto}
.cat-pill:active{transform:scale(.95)}
.cat-pill.active{opacity:1;box-shadow:0 0 8px rgba(255,255,255,.15)}

/* Feed */
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none}
#feed::-webkit-scrollbar{display:none}

/* Cards */
.card{height:100vh;height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;border-bottom:1px solid var(--border);position:relative;overflow:hidden}
.card-progress{position:absolute;top:0;left:0;right:0;height:3px;background:var(--border);z-index:2}
.card-progress-fill{height:100%;border-radius:0 2px 2px 0;transition:width .3s}
.card-header{padding:48px 20px 0;flex-shrink:0}
.card-meta{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.card-badge{padding:3px 10px;border-radius:12px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:#fff}
.card-topic{font-size:12px;color:var(--dim);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.card-counter{font-size:11px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums}
.card-title{font-size:20px;font-weight:700;line-height:1.3;margin-bottom:8px}

/* Scrollable card body */
.card-scroll{flex:1;overflow-y:auto;padding:0 20px 24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent;-webkit-overflow-scrolling:touch}
.card-scroll::-webkit-scrollbar{width:3px}
.card-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

.card-body{font-size:14px;line-height:1.75;color:#ccc}
.card-body p{margin-bottom:10px}
.card-body strong{color:var(--text);font-weight:600}
.card-body code:not([class*="language-"]){background:var(--code);padding:1.5px 5px;border-radius:4px;font-size:12px;font-family:'Fira Code',Consolas,monospace}
.card-body pre{background:var(--code);border-radius:8px;padding:12px;margin:8px 0;overflow-x:auto;border:1px solid #21262d;max-height:300px;overflow-y:auto}
.card-body pre code{font-size:12px;line-height:1.5;font-family:'Fira Code',Consolas,monospace;background:none;padding:0}
.card-body ul,.card-body ol{margin:6px 0 10px;padding-left:20px}
.card-body li{margin:3px 0}
.card-body li ul,.card-body li ol{margin:2px 0 2px;padding-left:16px}
.card-body blockquote{border-left:3px solid #444;padding:8px 12px;color:var(--dim);margin:10px 0;font-style:italic;background:rgba(255,255,255,.02);border-radius:0 6px 6px 0}
.card-body h3{font-size:15px;color:var(--text);margin:14px 0 6px;font-weight:600}
.card-body hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.card-body .katex-display{margin:10px 0;overflow-x:auto;padding:4px 0}
.card-body .katex{font-size:1.02em}

/* Fade at bottom of scrollable card */
.card-fade{position:absolute;bottom:0;left:0;right:0;height:40px;background:linear-gradient(transparent,var(--bg));pointer-events:none;z-index:1}

/* Topic divider */
.topic-divider{height:100vh;height:100dvh;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
.topic-divider .check{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:14px}
.topic-divider h2{font-size:20px;font-weight:700;margin-bottom:4px}
.topic-divider .done{color:var(--dim);font-size:13px}
.topic-divider .nxt-label{font-size:9px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);margin-top:28px}
.topic-divider .nxt-name{font-size:17px;font-weight:600;margin-top:6px}
.topic-divider .hint{font-size:11px;color:var(--dim);margin-top:36px;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:.6}}

/* Splash */
#splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:100;transition:opacity .5s}
#splash.hide{opacity:0;pointer-events:none}
#splash h1{font-size:30px;font-weight:800;background:linear-gradient(135deg,#e040fb,#00e5ff,#76ff03);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#splash p{color:var(--dim);margin-top:6px;font-size:13px}
#splash .spinner{width:22px;height:22px;border:2px solid var(--border);border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite;margin-top:20px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Stats bar at bottom */
#stats{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:540px;padding:6px 16px 8px;background:linear-gradient(transparent,var(--bg) 40%);z-index:10;display:flex;justify-content:center;gap:16px;font-size:10px;color:var(--dim);pointer-events:none}

@media(min-width:768px){
  #app{max-width:620px}
  #cat-bar{max-width:620px}
  #stats{max-width:620px}
  .card-header{padding:48px 28px 0}
  .card-scroll{padding:0 28px 24px}
  .card-title{font-size:22px}
  .card-body{font-size:14.5px}
}
</style>
</head>
<body>
<div id="app">
  <div id="splash"><h1>DoomScroll</h1><p>Learn while you scroll</p><div class="spinner"></div></div>
  <div id="cat-bar"></div>
  <div id="feed"></div>
  <div id="stats"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script>
(async()=>{
  const feed=document.getElementById('feed');
  const bar=document.getElementById('cat-bar');
  const stats=document.getElementById('stats');
  const splash=document.getElementById('splash');

  // Load manifest + all content in parallel
  let manifest;
  try{
    manifest=await fetch('content/manifest.json').then(r=>r.json());
  }catch(e){
    splash.innerHTML='<h1>DoomScroll</h1><p style="color:#f44">Failed to load content</p>';
    return;
  }

  const results=await Promise.allSettled(
    manifest.categories.map(cat=>
      fetch('content/'+cat.file).then(r=>r.json()).then(data=>({data,cat}))
    )
  );

  const allTopics=[];
  const catColors={};
  results.forEach(r=>{
    if(r.status!=='fulfilled')return;
    const {data,cat}=r.value;
    catColors[cat.label]=cat.color;
    data.topics.forEach(t=>{
      if(t.cards&&t.cards.length>0){
        allTopics.push({...t,cat:cat.label,color:cat.color});
      }
    });
  });

  // Build category bar
  const allPill=mk('span','cat-pill active');
  allPill.textContent='All';
  allPill.style.background='#555';
  allPill.onclick=()=>filterCat(null);
  bar.appendChild(allPill);

  manifest.categories.forEach(cat=>{
    const pill=mk('span','cat-pill');
    pill.textContent=cat.label;
    pill.style.background=cat.color;
    pill.dataset.cat=cat.label;
    pill.onclick=()=>filterCat(cat.label);
    bar.appendChild(pill);
  });

  // Shuffle
  function shuffle(a){for(let i=a.length-1;i>0;i--){const j=0|Math.random()*(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
  function mk(tag,cls){const e=document.createElement(tag);if(cls)e.className=cls;return e}

  let activeCat=null;
  let queue=[];
  let topicsSeen=0;
  let cardsSeen=0;

  function getPool(){
    return activeCat?allTopics.filter(t=>t.cat===activeCat):allTopics;
  }

  function refillQueue(){
    queue=shuffle([...getPool()]);
  }

  function nextTopic(){
    if(!queue.length)refillQueue();
    return queue.shift();
  }

  function filterCat(cat){
    activeCat=cat;
    bar.querySelectorAll('.cat-pill').forEach(p=>{
      if(!cat) p.classList.toggle('active',!p.dataset.cat);
      else p.classList.toggle('active',p.dataset.cat===cat);
    });
    feed.innerHTML='';
    topicsSeen=0;cardsSeen=0;
    refillQueue();
    for(let i=0;i<3;i++)renderTopic();
    feed.scrollTop=0;
    updateStats();
  }

  function renderTopic(){
    const topic=nextTopic();
    if(!topic)return;
    const n=topic.cards.length;
    topicsSeen++;

    topic.cards.forEach((card,i)=>{
      cardsSeen++;
      const el=mk('div','card');
      const progress=mk('div','card-progress');
      const fill=mk('div','card-progress-fill');
      fill.style.cssText=`width:${(i+1)/n*100}%;background:${topic.color}`;
      progress.appendChild(fill);

      const header=mk('div','card-header');
      header.innerHTML=`
        <div class="card-meta">
          <span class="card-badge" style="background:${topic.color}">${esc(topic.cat)}</span>
          <span class="card-topic">${esc(topic.name)}</span>
          <span class="card-counter">${i+1}/${n}</span>
        </div>
        <h2 class="card-title">${esc(card.title)}</h2>`;

      const scroll=mk('div','card-scroll');
      const body=mk('div','card-body');
      body.innerHTML=md(card.content);
      scroll.appendChild(body);

      const fade=mk('div','card-fade');

      el.appendChild(progress);
      el.appendChild(header);
      el.appendChild(scroll);
      el.appendChild(fade);
      feed.appendChild(el);

      // Prevent feed snap-scroll when scrolling inside card body
      scroll.addEventListener('touchstart',onScrollTouchStart,{passive:true});
      scroll.addEventListener('touchmove',onScrollTouch,{passive:false});
    });

    // Transition divider
    const peek=queue[0]||getPool()[0]||allTopics[0];
    const d=mk('div','topic-divider');
    d.innerHTML=`
      <div class="check" style="background:${topic.color}20;color:${topic.color}">&#10003;</div>
      <h2>${esc(topic.name)}</h2>
      <p class="done">Topic complete</p>
      ${peek?`<p class="nxt-label">Up next</p>
      <p class="nxt-name" style="color:${peek.color}">${esc(peek.name)}</p>`:''}
      <p class="hint">&darr; keep scrolling</p>`;
    feed.appendChild(d);

    try{Prism.highlightAllUnder(feed)}catch(e){}
    updateStats();
  }

  // Touch handling: let card body scroll internally before feed scrolls
  let touchStartY=0;
  function onScrollTouchStart(e){touchStartY=e.touches[0].clientY}
  function onScrollTouch(e){
    const el=e.currentTarget;
    const dy=touchStartY-e.touches[0].clientY;
    const atTop=el.scrollTop<=0;
    const atBottom=el.scrollTop+el.clientHeight>=el.scrollHeight-1;
    // If scrollable content and not at boundary, prevent feed scroll
    if(el.scrollHeight>el.clientHeight){
      if((dy>0&&!atBottom)||(dy<0&&!atTop)){
        e.stopPropagation();
      }
    }
  }

  function updateStats(){
    const pool=getPool();
    stats.innerHTML=`<span>${pool.length} topics</span><span>${pool.reduce((a,t)=>a+t.cards.length,0)} cards</span>`;
  }

  // Markdown renderer — line-based for robust list/paragraph handling
  function md(txt){
    if(!txt)return'';
    // Split preserving code blocks
    return txt.split(/(```[\s\S]*?```)/).map(part=>{
      if(part.startsWith('```')){
        const nl=part.indexOf('\n');
        const lang=(part.slice(3,nl).trim()||'python').toLowerCase();
        const code=part.slice(nl+1,part.length-3);
        return'<pre><code class="language-'+lang+'">'+esc(code)+'</code></pre>';
      }
      return renderLines(part);
    }).join('');
  }

  function renderLines(txt){
    const lines=txt.split('\n');
    let html='';
    let inList=false;
    let listTag='ul';
    let paraLines=[];

    function flushPara(){
      if(!paraLines.length)return;
      const t=paraLines.join('\n').trim();
      if(t) html+='<p>'+il(t)+'</p>';
      paraLines=[];
    }

    function closeList(){
      if(inList){html+='</li></'+listTag+'>';inList=false}
    }

    for(let i=0;i<lines.length;i++){
      const line=lines[i];
      const trimmed=line.trim();

      // Empty line — flush paragraph
      if(!trimmed){flushPara();closeList();continue}

      // Heading
      if(trimmed.startsWith('### ')){
        flushPara();closeList();
        html+='<h3>'+il(trimmed.slice(4))+'</h3>';
        continue;
      }

      // Horizontal rule
      if(/^-{3,}$/.test(trimmed)){
        flushPara();closeList();
        html+='<hr>';
        continue;
      }

      // Blockquote
      if(trimmed.startsWith('> ')){
        flushPara();closeList();
        let bq=trimmed.slice(2);
        while(i+1<lines.length&&lines[i+1].trim().startsWith('> ')){
          i++;bq+='<br>'+lines[i].trim().slice(2);
        }
        html+='<blockquote>'+il(bq)+'</blockquote>';
        continue;
      }

      // List item: - text, * text, 1. text, 1) text
      const lm=trimmed.match(/^([-*]|\d+[.)])\s+(.*)/);
      if(lm){
        flushPara();
        const ordered=/^\d/.test(lm[1]);
        const tag=ordered?'ol':'ul';
        const text=lm[2];
        if(!inList){
          html+='<'+tag+'>';
          listTag=tag;
          inList=true;
        }else if(listTag!==tag){
          html+='</li></'+listTag+'><'+tag+'>';
          listTag=tag;
        }else{
          html+='</li>';
        }
        html+='<li>'+il(text);

        // Sub-list items (indented)
        let hasSubList=false;
        while(i+1<lines.length){
          const next=lines[i+1];
          const sm=next.match(/^\s{2,}([-*]|\d+[.)])\s+(.*)/);
          if(sm){
            if(!hasSubList){html+='<ul>';hasSubList=true}
            else html+='</li>';
            html+='<li>'+il(sm[2]);
            i++;
          }else break;
        }
        if(hasSubList)html+='</li></ul>';
        continue;
      }

      // Display math block
      if(trimmed.startsWith('$$')){
        flushPara();closeList();
        let math=trimmed;
        while(!math.endsWith('$$')||math==='$$'){
          if(i+1>=lines.length)break;
          i++;math+='\n'+lines[i].trim();
        }
        try{html+=katex.renderToString(math.slice(2,-2).trim(),{displayMode:true,throwOnError:false})}
        catch(e){html+='<p>'+esc(math)+'</p>'}
        continue;
      }

      // Regular text — accumulate for paragraph
      if(inList){
        // Continuation of list item
        html+='<br>'+il(trimmed);
      }else{
        paraLines.push(trimmed);
      }
    }

    flushPara();
    closeList();
    return html;
  }

  // Inline formatting
  function il(s){
    s=s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
    s=s.replace(/\$([^$\n]+?)\$/g,(_,m)=>{
      try{return katex.renderToString(m,{throwOnError:false})}catch(e){return m}
    });
    s=s.replace(/\n/g,'<br>');
    return s;
  }

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

  // Initial render
  refillQueue();
  for(let i=0;i<3;i++)renderTopic();
  updateStats();

  // Infinite scroll
  feed.addEventListener('scroll',()=>{
    if(feed.scrollTop+feed.clientHeight>feed.scrollHeight-2000)renderTopic();
  });

  // Keyboard nav
  document.addEventListener('keydown',e=>{
    const h=window.innerHeight;
    if(e.key==='ArrowDown'||e.key===' '){feed.scrollBy({top:h,behavior:'smooth'});e.preventDefault()}
    if(e.key==='ArrowUp'){feed.scrollBy({top:-h,behavior:'smooth'});e.preventDefault()}
  });

  // Hide splash
  setTimeout(()=>splash.classList.add('hide'),500);
})();
</script>
</body>
</html>
